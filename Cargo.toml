[package]
name = "py-konclude"
description = "A wrapper around konclude"
version = "0.1.0"
authors = ["Björn Gehrke <bjoern.gehrke+pykonclude@uzh.ch>"]
edition = "2024"

[lib]
name="pykonclude"
crate-type=["cdylib"]

[dependencies]
horned-owl = "^1.4"
# git rather than path: cibuildwheel builds the project in an isolated
# directory (a container, on Linux), so a `../konclude-rs` sibling is not
# reachable from the build. For local work against a konclude-rs checkout,
# see the `.cargo/config.toml` snippet in CLAUDE.md.
konclude-rs = { git = "https://github.com/ontology-tools/konclude-rs" }
py-horned-owl-reasoner = { git = "https://github.com/ontology-tools/py-horned-owl" }
