name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feature/CI"
  release:
    types:
      - published

env:
  # Konclude revision compiled into the wheels. Pinned rather than tracking a
  # branch so that builds are reproducible and the build cache below has a
  # meaningful key -- bump it to pick up reasoner changes.
  KONCLUDE_REF: 0906e212047f1108c75ad4b9352faeacf19c49a0

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # one platform's toolchain breaking should not hide the state of the rest
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64
          - os: windows-intel
            runs-on: windows-latest
        #   - os: windows-arm
        #     runs-on: windows-11-arm
          # No macos-arm leg: Qt 5.15 has no arm64 macOS build (the official
          # open-source binaries stop at 5.15.2, x86_64 only), and Konclude
          # does not build against Qt 6. Apple Silicon users run the x86_64
          # wheel under Rosetta.
          - os: macos-intel
            # macos-13 was the last x86_64 runner
            runs-on: macos-13
            # the runner's own OS; the Qt 5.15.2 binaries below support 10.13+,
            # so this can be lowered once a wheel built that way is verified
            macos-target: '13.0'

    steps:
      - uses: actions/checkout@v4

      - name: Check out Konclude
        uses: actions/checkout@v4
        with:
          repository: ontology-tools/Konclude
          ref: ${{ env.KONCLUDE_REF }}
          path: Konclude

      # Konclude is ~1300 translation units; a cold build runs well over 20
      # minutes on every platform. ci/build-konclude.{sh,bat} short-circuit
      # when the library is already in place, so a hit skips the build.
      - name: Cache libKonclude
        id: konclude-cache
        uses: actions/cache@v4
        with:
          path: pykonclude/lib
          key: konclude-${{ matrix.os }}-${{ env.KONCLUDE_REF }}

      # On Linux, cibuildwheel's before-all runs inside a container whose
      # filesystem is thrown away, so the library would never reach the cache
      # above. Run the build ourselves in the *same* manylinux image (pinned to
      # match [tool.cibuildwheel.linux] in pyproject.toml) with the workspace
      # bind-mounted; before-all then finds the library and short-circuits.
      - name: Build libKonclude
        if: runner.os == 'Linux' && steps.konclude-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            ${{ matrix.manylinux-image }} bash ci/build-konclude.sh
          # the container runs as root; hand the artefacts back to the runner
          sudo chown -R "$(id -u):$(id -g)" pykonclude/lib Konclude

      # Linux gets Qt from dnf inside the manylinux container (above). macOS and
      # Windows take the official Qt binaries: pinned, and not subject to
      # Homebrew deprecating qt@5 out from under the build. The action puts
      # qmake on PATH, which is all ci/build-konclude.sh needs.
      - name: Install Qt 5
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2019_64' || 'clang_64' }}

      # windows-latest ships Visual Studio 2026, whose STL dropped
      # stdext::make_checked_array_iterator -- Qt 5.15's qlist.h calls it
      # unconditionally under MSVC, so the Konclude build dies with
      # "error C2653: 'stdext': is not a class or namespace name". The image
      # keeps the v143 toolset around for exactly this; pin to it. (Qt 6 has
      # the guard, but Konclude does not build against Qt 6.)
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: '14.44'

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0.1
        env:
          # everything else lives in [tool.cibuildwheel] in pyproject.toml
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test:
    name: Run tests
    needs: [build_wheels]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
        #   - os: windows-arm
        #     runs-on: windows-11-arm
          # no macos-arm: no arm64 wheel is built, see build_wheels above
          - os: macos-intel
            # macos-13 was the last x86_64 runner
            runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test
            ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Install dependencies
        # --only-binary: dist also holds the sdist, and silently building that
        # from source here would test a different artefact than we ship
        run: pip install --only-binary=py-konclude --find-links=dist pytest py-konclude

      # The plugin is loaded across a Rust ABI boundary, so it and the
      # py-horned-owl wheel pip just resolved from PyPI must come from the same
      # rustc. A mismatch is undefined behaviour that presents as nonsense
      # results rather than a load failure, so check it before trusting a green
      # test run.
      - name: Check Rust ABI compatibility
        run: python ci/check_abi.py

      - name: Test with pytest
        run: pytest --doctest-modules --junitxml=junit/test-results-${{ matrix.os }}.xml test/
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: junit/test-results-${{ matrix.os }}.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  upload_pypi:
    needs: [test,build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-konclude
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
